<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Medolingo Academy</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #083D42; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <iframe id="medolingo-frame" src="about:blank" allow="clipboard-read; clipboard-write"></iframe>

    <script>
        (function() {
            var baseUrl = "https://script.google.com/macros/s/AKfycbxcvamb7Y3-Mp-sf8gLsZXHVNlY_jMcSauaL7yn6DyYbTRX8LukJZx8mDlmBeghUOY3Qg/exec";
            var query = window.location.search || "";
            var frame = document.getElementById("medolingo-frame");
            if (frame) {
                frame.src = baseUrl + query;
            }
        })();
    </script>
</body>
</html>
